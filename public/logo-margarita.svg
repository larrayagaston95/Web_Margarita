<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none">
  <!-- Fondo transparente -->
  <!-- Flor Margarita Oficial (9 pétalos multicolores) -->
  <g transform="translate(260, 95)">
    <!-- 9 Pétalos con contorno negro -->
    <!-- 1. Amarillo (Arriba) -->
    <path d="M 0 0 m -11,-22 C -16,-46 -15,-64 0,-64 C 15,-64 16,-46 11,-22 Z" transform="rotate(0)" fill="#FFDA00" stroke="#111111" stroke-width="4.2" stroke-linejoin="round" />
    
    <!-- 2. Verde Kelly -->
    <path d="M 0 0 m -11,-22 C -16,-46 -15,-64 0,-64 C 15,-64 16,-46 11,-22 Z" transform="rotate(40)" fill="#00A651" stroke="#111111" stroke-width="4.2" stroke-linejoin="round" />
    
    <!-- 3. Verde Lima -->
    <path d="M 0 0 m -11,-22 C -16,-46 -15,-64 0,-64 C 15,-64 16,-46 11,-22 Z" transform="rotate(80)" fill="#82C330" stroke="#111111" stroke-width="4.2" stroke-linejoin="round" />
    
    <!-- 4. Celeste Cielo -->
    <path d="M 0 0 m -11,-22 C -16,-46 -15,-64 0,-64 C 15,-64 16,-46 11,-22 Z" transform="rotate(120)" fill="#41B2E6" stroke="#111111" stroke-width="4.2" stroke-linejoin="round" />
    
    <!-- 5. Azul Intenso -->
    <path d="M 0 0 m -11,-22 C -16,-46 -15,-64 0,-64 C 15,-64 16,-46 11,-22 Z" transform="rotate(160)" fill="#008FD5" stroke="#111111" stroke-width="4.2" stroke-linejoin="round" />
    
    <!-- 6. Violeta Lavanda -->
    <path d="M 0 0 m -11,-22 C -16,-46 -15,-64 0,-64 C 15,-64 16,-46 11,-22 Z" transform="rotate(200)" fill="#A0A3D4" stroke="#111111" stroke-width="4.2" stroke-linejoin="round" />
    
    <!-- 7. Rosa Suave -->
    <path d="M 0 0 m -11,-22 C -16,-46 -15,-64 0,-64 C 15,-64 16,-46 11,-22 Z" transform="rotate(240)" fill="#ECA2C7" stroke="#111111" stroke-width="4.2" stroke-linejoin="round" />
    
    <!-- 8. Rosa Coral -->
    <path d="M 0 0 m -11,-22 C -16,-46 -15,-64 0,-64 C 15,-64 16,-46 11,-22 Z" transform="rotate(280)" fill="#E85A7A" stroke="#111111" stroke-width="4.2" stroke-linejoin="round" />
    
    <!-- 9. Naranja -->
    <path d="M 0 0 m -11,-22 C -16,-46 -15,-64 0,-64 C 15,-64 16,-46 11,-22 Z" transform="rotate(320)" fill="#F58220" stroke="#111111" stroke-width="4.2" stroke-linejoin="round" />

    <!-- Centro Blanco con contorno negro -->
    <circle cx="0" cy="0" r="23" fill="#FFFFFF" stroke="#111111" stroke-width="4.8" />
    
    <!-- Detalle gráfico interior: comilla / tilde de brillo y punto -->
    <path d="M 4 -12 C 8 -9 9 -4 6 0 C 4 -3 5 -8 1 -10 Z" fill="#111111" />
    <circle cx="6" cy="6" r="2.4" fill="#111111" />
  </g>

  <!-- Tipografía Oficial: MARGARITA -->
  <text 
    x="260" 
    y="235" 
    text-anchor="middle" 
    fill="#111111" 
    font-size="64" 
    font-weight="900" 
    letter-spacing="5"
    font-family="'Playfair Display', 'Rozha One', 'Cinzel Decorative', Georgia, serif"
  >
    MARGARITA
  </text>

  <!-- Subtítulo Oficial: Indumentaria Infantil -->
  <text 
    x="260" 
    y="285" 
    text-anchor="middle" 
    fill="#111111" 
    font-size="28" 
    font-weight="500" 
    letter-spacing="2"
    font-family="'Patrick Hand', 'Caveat', 'Comic Neue', cursive, sans-serif"
  >
    Indumentaria Infantil
  </text>
</svg>
